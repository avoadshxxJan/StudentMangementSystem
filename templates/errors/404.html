{% extends 'base.html' %}

{% block title %}Page Not Found | EduTrack{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-edutrack p-5">
                <div class="display-1 text-warning mb-3"><i class="bi bi-question-diamond"></i></div>
                <h2 class="fw-bold">404 &mdash; Record Not Found</h2>
                <p class="text-muted mt-2">
                    The requested college resource, student profile, or report does not exist.
                </p>
                <div class="mt-4">
                    <a href="{% url 'home' %}" class="btn btn-edutrack-primary">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
