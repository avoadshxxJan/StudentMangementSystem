{% extends 'base.html' %}

{% block title %}System Error | EduTrack{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-edutrack p-5">
                <div class="display-1 text-danger mb-3"><i class="bi bi-exclamation-triangle-fill"></i></div>
                <h2 class="fw-bold">500 &mdash; Internal Server Error</h2>
                <p class="text-muted mt-2">
                    An unexpected system condition occurred. Details have been logged for administrative inspection.
                </p>
                <div class="mt-4">
                    <a href="{% url 'home' %}" class="btn btn-edutrack-primary">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
