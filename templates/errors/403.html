{% extends 'base.html' %}

{% block title %}Access Denied | EduTrack{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-edutrack p-5">
                <div class="display-1 text-danger mb-3"><i class="bi bi-shield-x"></i></div>
                <h2 class="fw-bold">403 &mdash; Permission Denied</h2>
                <p class="text-muted mt-2">
                    You do not have authorization to access this institutional record or department scope.
                </p>
                <div class="mt-4">
                    <a href="{% url 'home' %}" class="btn btn-edutrack-primary">
                        <i class="bi bi-house-door me-1"></i> Return to Safety
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
